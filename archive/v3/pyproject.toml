[project]
name = "genmedia-sxs-v3"
version = "0.1.0"
description = "GenMedia SxS v3 — execution-centric evaluation harness (refactor)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pydantic-settings>=2",
    "google-cloud-firestore",
    "google-cloud-storage",
    "google-genai",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
